runtime: python310
entrypoint: gunicorn -b :$PORT --timeout=300 app:app

env_variables:
  OPENAI_API_KEY: "YOUR_OPENAI_API_KEY"
  HUGGING_FACE_TOKEN: "YOUR_HUGGING_FACE_TOKEN"

handlers:
- url: /favicon.ico
  static_files: static/Transcription_AI_Gadi_Oren.ico
  upload: static/Transcription_AI_Gadi_Oren.ico

- url: /static
  static_dir: static

- url: /.*
  script: auto

instance_class: F2
